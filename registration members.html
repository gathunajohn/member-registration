
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration System</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>
<body>

    <div class="container">

        <header>
            <h1>Member Registration System</h1>
            <p>Register and manage your members easily.</p>

            <button type="button" id="darkModeButton">
                🌙 Dark Mode
            </button>
        </header>

        <div id="successMessage" class="success-message" role="status" aria-live="polite" hidden>
            Member registered successfully!
        </div>

        <section class="form-section">
            <h2>Register New Member</h2>

            <form id="memberForm" novalidate>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter full name">
                    <span class="error" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 0712345678">
                    <span class="error" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error" id="genderError"></span>
                </div>

                <div class="form-group">
                    <label for="membership">Membership Type</label>
                    <select id="membership">
                        <option value="">Select membership</option>
                        <option value="Basic">Basic</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>
                    <span class="error" id="membershipError"></span>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" rows="3" placeholder="Enter your address"></textarea>
                    <span class="error" id="addressError"></span>
                </div>

                <button type="submit" class="submit-button">
                    Register Member
                </button>

            </form>
        </section>

        <section class="members-section">
            <h2>Registered Members</h2>

            <div class="counter">
                Total Members: <span id="memberCounter">0</span>
            </div>

            <ul id="memberList" aria-label="Registered members">
                <!-- Registered members will appear here -->
            </ul>
        </section>

    </div>

</body>
</html>
